name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET ${{ matrix.framework }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: '10'
            os: windows-latest
            sdk: '10.0.x'
            args: ''
          - framework: '8'
            os: windows-2022
            sdk: '8.0.x'
            args: '-Legacy'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.sdk }}
      - shell: pwsh
        run: ./build.ps1 ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-api-test-results-net${{ matrix.framework }}
          path: TestResults/

  publish-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: dotnet publish DrivingSchool.Desktop/DrivingSchool.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/DrivingSchool
      - uses: actions/upload-artifact@v4
        with:
          name: DrivingSchool-win-x64
          path: publish/DrivingSchool/
